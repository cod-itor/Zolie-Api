# Zolie local stack.
#
#   docker compose up -d                          database only (run the API from your IDE or ./gradlew bootRun)
#   docker compose --profile app up -d --build    database + API in Docker (http://localhost:8080/swagger-ui.html)
#   docker compose --profile app down             stop everything (add -v to also delete the database data)
#
# Credentials come from the git-ignored .env file. Copy .env.example to .env first.
services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: zolie-db
    environment:
      POSTGRES_DB: zolie
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - zolie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d zolie"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    profiles: ["app"]
    container_name: zolie-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/zolie
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "8080:8080"

volumes:
  zolie-db-data:
