spring.config.import=optional:file:.env[.properties]
spring.application.name=ZolieAPI
server.port=8080
server.compression.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

management.endpoints.web.exposure.include=health

# Zolie settings (all optional in development)
zolie.auth.dev-tokens-enabled=${DEV_AUTH_ENABLED:false}
zolie.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
zolie.storage.endpoint=${R2_ENDPOINT:}
zolie.storage.bucket=${R2_BUCKET:}
zolie.storage.access-key=${R2_ACCESS_KEY:}
zolie.storage.secret-key=${R2_SECRET_KEY:}
zolie.storage.public-base-url=${R2_PUBLIC_BASE_URL:}
